# Runs lint and build on every push and on every pull request into main.
# The "Lint and build" check is required by the "Protect main" ruleset,
# so a PR can't merge until it passes.
name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

# If a new commit is pushed while an older run is still going, cancel the old one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Placeholder values so lib/supabase.js can create its client during the build.
    # These are NOT real credentials and never connect to the real database.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-key

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
